name: Build IVC Windows App
on:
  workflow_dispatch:
  push:
    branches: [codex/leq-studio]
    paths:
      - desktop/**
      - scripts/*desktop*.mjs
      - .github/workflows/desktop-windows.yml
permissions:
  contents: read
concurrency:
  group: ivc-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-desktop.mjs
      - run: npm run test:desktop
      - name: Verify package contents
        run: node scripts/verify-desktop-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IVC-Desktop-Windows-x64
          path: |
            release/IVC-Desktop-Windows-x64.zip
            release/IVC-Desktop-Windows-x64.zip.sha256
          retention-days: 14
          if-no-files-found: error
